services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ofs
      POSTGRES_PASSWORD: ofs
      POSTGRES_DB: ofs
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofs -d ofs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://ofs:ofs@db:5432/ofs
      APP_URL: http://localhost:5173
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
