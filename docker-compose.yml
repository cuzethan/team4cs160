services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ofs
      POSTGRES_PASSWORD: ofs
      POSTGRES_DB: ofs
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofs -d ofs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://ofs:ofs@db:5432/ofs
      APP_URL: http://localhost:5173
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      ROBOT_SIMULATOR_INTERVAL_MS: ${ROBOT_SIMULATOR_INTERVAL_MS:-1000}
      ROBOT_SIMULATOR_SPEED_MULTIPLIER: ${ROBOT_SIMULATOR_SPEED_MULTIPLIER:-60}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    ports:
      - "8002:8002"
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-}
    volumes:
      - valhalla-data:/custom_files

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3001
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  valhalla-data:
